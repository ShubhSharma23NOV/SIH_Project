spring.application.name=backend

# ========== MAIN DATA FIREBASE (Sensors, Symptoms, Water Quality) ==========
# Google Cloud Configuration
spring.cloud.gcp.project-id=${FIREBASE_PROJECT_ID:arogyajal2}
spring.cloud.gcp.firestore.project-id=${FIREBASE_PROJECT_ID:arogyajal2}

# Firestore Configuration
spring.cloud.gcp.firestore.enabled=true
spring.cloud.gcp.firestore.credentials.location=classpath:firebase-service-account.json
spring.cloud.gcp.firestore.database-id=(default)

# Firebase Configuration (Main Data)
firebase.project-id=${FIREBASE_PROJECT_ID:arogyajal2}
firebase.database-url=${FIREBASE_DATABASE_URL:https://arogyajal2.firebaseio.com}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:arogyajal2.firebasestorage.app}

# ========== USER AUTHENTICATION FIREBASE (SEPARATE PROJECT) ==========
# Dedicated Firebase project for user authentication only
# Benefits: No quota conflicts, better security, independent scaling
firebase.users.project-id=${FIREBASE_USERS_PROJECT_ID:arogyajal-users}
firebase.users.database-url=${FIREBASE_USERS_DATABASE_URL:https://arogyajal-users.firebaseio.com}
firebase.users.credentials.location=classpath:firebase-users-service-account.json


# Server Configuration
# ArogyaJal - Water Quality Monitoring for North East India
# Target Region: Assam, Meghalaya, Arunachal Pradesh, Nagaland, Manipur, Mizoram, Tripura & Sikkim
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0


# Logging Configuration
logging.level.root=INFO
logging.level.com.arogyajal=DEBUG
logging.file.name=logs/arogyajal-backend.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
cors.allow-credentials=true
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
ml.sync.enabled=${ML_SYNC_ENABLED:true}

# Python ML API Configuration
ml.python.api.url=${ML_SERVICE_URL:http://localhost:5000}
ml.python.api.enabled=true
ml.python.api.timeout=${ML_API_TIMEOUT:30000}

# Static Resource Configuration
# Prevent Spring from treating /api/** as static resources
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/static/**

# OPTIMIZATION: Cache Configuration (Reduces Firestore reads by 95%)
spring.cache.type=caffeine
spring.cache.cache-names=dashboard,sensors,alerts,symptoms,clusters,stats,locations
app.cache.ttl=${CACHE_TTL:1800}
app.demo-mode=${DEMO_MODE:false}

# n8n Webhook Configuration
# SECURITY: Sensitive values loaded from .env file
# Syntax: ${ENV_VAR:default_value}
# Set N8N_WEBHOOK_URL environment variable with your n8n webhook URL
# Example: N8N_WEBHOOK_URL=https://your-n8n-instance.com/webhook/xyz
n8n.webhook.url=${N8N_WEBHOOK_URL:https://arogyajal464.app.n8n.cloud/webhook/water-alert}
n8n.webhook.enabled=${N8N_WEBHOOK_ENABLED:true}
n8n.webhook.timeout=${N8N_WEBHOOK_TIMEOUT:15000}
n8n.webhook.min-severity=${N8N_WEBHOOK_MIN_SEVERITY:LOW}

