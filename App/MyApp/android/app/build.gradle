apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Folders */
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    
    /* Entry file */
    entryFile = file("../../index.js")
    
    /* Bundling */
    bundleAssetName = "index.android.bundle"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.Arogya_jal.app"
    
    defaultConfig {
        applicationId "com.Arogya_jal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    
    // JSC (JavaScript Core)
    implementation jscFlavor
    
    // Add javax.annotation for @Nullable and @Nonnull
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    
    // Add AndroidX core for ContextCompat
    implementation 'androidx.core:core:1.12.0'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    
    // React Native Firebase
    implementation project(':react-native-firebase_app')
    implementation project(':react-native-firebase_auth')
    implementation project(':react-native-firebase_firestore')
    
    // AsyncStorage
    implementation project(':@react-native-async-storage_async-storage')
    
    // SQLite Storage
    implementation project(':react-native-sqlite-storage')
    
    // NetInfo
    implementation project(':@react-native-community_netinfo')
    
    // WebView
    implementation project(':react-native-webview')
    
    // Geolocation Service
    implementation project(':react-native-geolocation-service')
    
    // Training Module Dependencies
    implementation project(':react-native-fs')
    implementation project(':react-native-video')
}

apply plugin: 'com.google.gms.google-services'

// React Native Vector Icons
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
